<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mi sitio mínimo</title>
  <meta name="description" content="Sitio estático mínimo de ejemplo" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Mi sitio mínimo</h1>
    <p class="tagline">Una página estática con los archivos mínimos</p>
  </header>

  <main>
    <section id="about" class="card">
      <h2>Bienvenido</h2>
      <p>Esta es la estructura mínima para un sitio web estático: <code>index.html</code>, <code>styles.css</code> y <code>script.js</code>.</p>
      <button id="actionBtn">Haz clic</button>
    </section>

    <section id="output" class="card" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span> — Sitio mínimo</small>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
